<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Complete — Havana Elephant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #1a1a2e;
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .icon { font-size: 56px; margin-bottom: 20px; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: #fff; }
        .message { font-size: 16px; line-height: 1.6; color: #aaa; margin-bottom: 28px; }
        .status-badge {
            display: inline-block;
            background: rgba(255, 107, 53, 0.12);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #FF6B35;
            margin-bottom: 28px;
        }
        .status-badge.approved { background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.3); color: #4ade80; }
        .status-badge.declined { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: #f87171; }
        .cta {
            display: inline-block;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
        }
        .footer-note { margin-top: 24px; font-size: 12px; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" id="icon">🪪</div>
        <h1 id="heading">Verification Submitted</h1>
        <p class="message" id="message">
            You can close this tab and return to the Havana Elephant presale —
            your status will update there automatically.
        </p>
        <div class="status-badge" id="status-badge" style="display:none;"></div>
        <a href="https://presale.havanaelephant.com" class="cta">← Return to Presale</a>
        <p class="footer-note">© 2026 Havana Elephant Global S.A.</p>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var status = (params.get('status') || '').trim();
            var icon = document.getElementById('icon');
            var heading = document.getElementById('heading');
            var message = document.getElementById('message');
            var badge = document.getElementById('status-badge');

            if (status) {
                badge.style.display = 'inline-block';
                badge.textContent = status;
            }

            var s = status.toLowerCase();
            if (s === 'approved') {
                icon.textContent = '✅';
                heading.textContent = 'Verification Approved';
                message.textContent = 'Your identity has been verified. Return to the presale tab to complete your purchase.';
                badge.className = 'status-badge approved';
            } else if (s === 'declined') {
                icon.textContent = '❌';
                heading.textContent = 'Verification Unsuccessful';
                message.textContent = 'We were unable to verify your identity. Return to the presale for more information.';
                badge.className = 'status-badge declined';
            } else if (s === 'in review' || s === 'in_review') {
                icon.textContent = '⏳';
                heading.textContent = 'Under Review';
                message.textContent = 'Your verification is being reviewed by our team. We\'ll notify you once it\'s complete.';
            }
        })();
    </script>
</body>
</html>
